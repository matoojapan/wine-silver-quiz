<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワイン検定シルバー 4択問題</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2320;--sub:#7a6e68;--wine:#7b1e3a;--wine2:#a8355a;--line:#e7dfd6;--ok:#2e7d4f;--okbg:#e6f4ec;--ng:#b3261e;--ngbg:#fbe9e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
header{background:var(--wine);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--wine)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px;background:#fff}
.chk input{accent-color:var(--wine)}
.chk small{color:var(--sub);margin-left:auto}
.chk .bad{color:var(--ng);font-size:11px;margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;border-radius:8px;border:1px solid var(--wine);background:#fff;color:var(--wine);padding:8px 14px;cursor:pointer}
button.primary{background:var(--wine);color:#fff}
button:disabled{opacity:.4;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;background:#fff}
.seg input{display:none}
.seg input:checked+span{color:var(--wine);font-weight:700}
.seg label:has(input:checked){border-color:var(--wine);background:#fbf0f3}
.meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--wine2)}
.q{font-size:17px;font-weight:600;margin:4px 0 14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);color:var(--ink);background:#fff;margin-bottom:8px;padding:11px 12px;border-radius:10px;font-size:15px}
.opt b{color:var(--wine);margin-right:8px}
.opt:disabled{opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.fb{border-radius:10px;padding:12px;margin-top:6px;font-size:14px}
.fb.ok{background:var(--okbg)}
.fb.ng{background:var(--ngbg)}
.fb strong{display:block;margin-bottom:2px}
.src{font-size:12px;color:var(--sub);margin-top:6px}
.big{font-size:34px;font-weight:700;color:var(--wine);text-align:center;margin:6px 0}
.center{text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
th{color:var(--sub);font-weight:500}
.list li{margin-bottom:10px;font-size:14px}
.list .a{color:var(--ok);font-weight:600}
.note{font-size:12px;color:var(--sub)}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>ワイン検定シルバー 4択問題</h1>
<p>教本の黄色マーカー部分から作成 ／ 全<span id="total"></span>問</p>
</header>
<main>

<section id="home">
  <div class="card">
    <h2>1. 国を選ぶ</h2>
    <div class="grid" id="countries"></div>
    <div class="row">
      <button id="all">すべて選択</button>
      <button id="none">選択を解除</button>
    </div>
  </div>
  <div class="card">
    <h2>2. 出題のしかた</h2>
    <div class="seg" id="modes">
      <label><input type="radio" name="mode" value="all" checked><span>選んだ国の全問</span></label>
      <label><input type="radio" name="mode" value="10"><span>ランダム10問</span></label>
      <label><input type="radio" name="mode" value="20"><span>ランダム20問</span></label>
      <label><input type="radio" name="mode" value="wrong"><span>間違えた問題だけ</span></label>
    </div>
    <div class="seg" style="margin-top:10px">
      <label><input type="checkbox" id="shuffleQ" checked><span>問題の順番をシャッフル</span></label>
    </div>
    <div class="row">
      <button class="primary" id="start">はじめる</button>
    </div>
    <p class="note" id="count"></p>
  </div>
  <div class="card">
    <h2>成績</h2>
    <table id="stats"></table>
    <div class="row">
      <button id="showWrong">間違えた問題の一覧</button>
      <button id="reset">記録をリセット</button>
    </div>
    <p class="note">記録はこのブラウザにだけ保存されます。別の端末とは共有されません。</p>
  </div>
  <div class="card hidden" id="wrongList">
    <h2>間違えた問題の一覧</h2>
    <ol class="list" id="wrongItems"></ol>
  </div>
  <div class="card hidden" id="confirmReset">
    <p>正解・不正解の記録をすべて消しますか？</p>
    <div class="row"><button class="primary" id="doReset">消す</button><button id="cancelReset">やめる</button></div>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="card">
    <div class="meta"><span id="qinfo"></span><span id="qscore"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <div class="row">
      <button class="primary hidden" id="next">次へ</button>
      <button id="quit">終了してホームへ</button>
    </div>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card center">
    <h2>結果</h2>
    <div class="big" id="rscore"></div>
    <p id="rmsg"></p>
    <div class="row" style="justify-content:center">
      <button class="primary" id="retryWrong">今回間違えた問題をもう一度</button>
      <button id="home2">ホームへ</button>
    </div>
  </div>
  <div class="card" id="rwrongCard">
    <h2>今回間違えた問題</h2>
    <ol class="list" id="rwrong"></ol>
  </div>
</section>

</main>
<script>
const DATA = [{"k":"japan","n":"日本","qs":[{"r":"総論","q":"「日本ワイン」の定義として正しいものは？","o":["国産ブドウのみを原料とし、日本国内で製造された果実酒","国内で製造された果実酒すべて","国産ブドウを85%以上使った果実酒","国産ブドウを使い、海外で製造された果実酒"],"e":"国産ブドウのみ＋国内製造。原料を問わない国内製造の果実酒は「国内製造ワイン」。","p":4,"id":"japan-1"},{"r":"総論","q":"原料が国産か海外産かにかかわらず、国内で製造された果実酒と甘味果実酒を何と呼ぶ？","o":["国内製造ワイン","日本ワイン","輸入ワイン","地ワイン"],"e":"日本ワインを含む国内製造の果実酒・甘味果実酒の総称。","p":4,"id":"japan-2"},{"r":"総論","q":"日本ワインの生産量1位〜3位の正しい順は？","o":["山梨県・長野県・北海道","長野県・山梨県・北海道","山梨県・北海道・長野県","山梨県・長野県・山形県"],"e":"4位山形県、5位岩手県と続く。","p":4,"id":"japan-3"},{"r":"総論","q":"ブドウ産地の北端（北海道名寄）と南端（沖縄県恩納村）の緯度の差は約何度？","o":["約18度","約6度","約12度","約24度"],"e":"フランス（シャンパーニュ〜コルシカ）の約6度と比べて大きい。","p":5,"id":"japan-4"},{"r":"総論","q":"教本が挙げる日本ワインの主な特徴3つに含まれないものは？","o":["長い伝統をもつ成熟した産業","多様性に富む","発展途上の新しい産業","生産規模が小さい"],"e":"3つは「多様性に富む」「発展途上の新しい産業」「生産規模が小さい」。","p":5,"id":"japan-5"},{"r":"歴史","q":"1874年、甲府で本格的なワイン造りを始めた2人は？","o":["山田宥教と詫間憲久","高野正誠と土屋助次郎","川上善兵衛と高野正誠","詫間憲久と土屋龍憲"],"e":"これが日本のワイン造りの始まりとされる。","p":5,"id":"japan-6"},{"r":"歴史","q":"新潟県にワイナリーを創立し、1927年にマスカット・ベーリーAやブラック・クイーンを開発した人物は？","o":["川上善兵衛","山田宥教","土屋助次郎","高野正誠"],"e":"「日本ワインの父」と呼ばれる。","p":5,"id":"japan-7"},{"r":"歴史","q":"「ワイン元年」と呼ばれる年は？","o":["1973年","1964年","1975年","1998年"],"e":"1975年にはワインの消費量が甘味果実酒を上回った。","p":5,"id":"japan-8"},{"r":"歴史","q":"1975年の出来事として正しいものは？","o":["ワインの消費量が甘味果実酒を上回った","「山梨」が地理的表示に指定された","ワインブームがピークを迎えた","甲州がO.I.V.に登録された"],"e":"ワイン元年（1973年）の2年後。","p":5,"id":"japan-9"},{"r":"ワイン法","q":"酒税法で「酒類」と定義されるのはアルコール度数何度以上の飲料？","o":["1度以上","0.5度以上","3度以上","5度以上"],"e":"酒税法は酒類を4つに分けて税率を定めている。","p":6,"id":"japan-10"},{"r":"ワイン法","q":"国税庁が初めてワインの産地名として地理的表示に指定したのは？","o":["2013年の「山梨」","2010年の「山梨」","2013年の「長野」","2018年の「北海道」"],"e":"2018年には「北海道」が指定された。","p":6,"id":"japan-11"},{"r":"ワイン法","q":"2018年に国税庁が地理的表示に指定したワインの産地は？","o":["北海道","長野","山形","新潟"],"e":"山梨（2013年）に次ぐ指定。","p":6,"id":"japan-12"},{"r":"ワイン法","q":"ワインのラベル表示を規定する法制度（果実酒等の製法品質表示基準）が施行された日は？","o":["2018年10月30日","2015年10月1日","2013年7月16日","2010年4月1日"],"e":"基準を定めたのは2015年10月、施行は2018年10月30日。","p":6,"id":"japan-13"},{"r":"ワイン法","q":"表ラベルに「日本ワイン」の表記・地名・ブドウ品種名・収穫年を記すことができるのは？","o":["日本ワインのみ","国内製造ワインすべて","輸入ワインのみ","地理的表示のあるワインのみ"],"e":"海外原料を使ったワインは表ラベルに地名や品種を表示できない。","p":6,"id":"japan-14"},{"r":"ワイン法","q":"地名を「産地名」として表示できる条件は？","o":["地名の範囲内にブドウの収穫地（85%以上使用）と醸造地がある","地名の範囲内にブドウの収穫地（85%以上使用）がある","地名の範囲内に醸造地がある","地名の範囲内のブドウを100%使用している"],"e":"収穫地だけなら「収穫地名」、醸造地だけなら「醸造地名」の表示になる。","p":6,"id":"japan-15"},{"r":"ワイン法","q":"単一のブドウ品種名を表示するには、その品種を何%以上使う必要がある？","o":["85%以上","50%以上","75%以上","100%"],"e":"2品種表示は合計85%以上で、量の多い順に表示。","p":6,"id":"japan-16"},{"r":"ワイン法","q":"ブドウの収穫年を表示できる条件は？","o":["同一収穫年のブドウを85%以上使用","同一収穫年のブドウを75%以上使用","同一収穫年のブドウを100%使用","収穫年の表示は認められていない"],"e":"日本ワインの表示ルール。","p":6,"id":"japan-17"},{"r":"品種","q":"日本でワインに仕込まれている量が最も多い品種と、2番目の品種の組み合わせは？","o":["甲州 → マスカット・ベーリーA","マスカット・ベーリーA → 甲州","甲州 → ナイアガラ","デラウェア → 甲州"],"e":"そのあとにナイアガラ、コンコード、デラウェアが続く。","p":6,"id":"japan-18"},{"r":"品種","q":"甲州とマスカット・ベーリーAがO.I.V.のリストに掲載された年の組み合わせは？","o":["甲州2010年、マスカット・ベーリーA2013年","甲州2013年、マスカット・ベーリーA2010年","どちらも2010年","どちらも2013年"],"e":"これによりEUへの輸出時に品種名をボトルに記載できるようになった。","p":6,"id":"japan-19"},{"r":"品種","q":"甲州の果皮の特徴として正しいものは？","o":["やや薄い藤紫色で、グリ系品種ともいう","濃い黒紫色","黄緑色","赤褐色で、ロゼ専用品種"],"e":"分類は白。醸造用と生食用に使われる。","p":6,"id":"japan-20"},{"r":"品種","q":"次のうち白ブドウはどれ？","o":["ナイアガラ","ツヴァイゲルト","ヤマ・ソービニオン","メルロ"],"e":"ツヴァイゲルト、ヤマ・ソービニオン、メルロはいずれも黒ブドウ。","p":7,"id":"japan-21"},{"r":"品種","q":"ヨーロッパ系品種の中で、日本での生産量が第1位の品種は？","o":["メルロ","シャルドネ","カベルネ・ソーヴィニヨン","ピノ・ノワール"],"e":"2位シャルドネ、3位カベルネ・ソーヴィニヨン。","p":7,"id":"japan-22"},{"r":"品種","q":"メルロの産地として名高い、長野県塩尻市の地区は？","o":["桔梗ヶ原","善光寺平","伊那谷","勝沼"],"e":"1989・90年にメルシャンの桔梗ヶ原メルロが国際コンクールで大金賞を受賞。","p":7,"id":"japan-23"},{"r":"品種","q":"大半が北海道で栽培され、北海道の代表的な品種とされる白ブドウは？","o":["ケルナー","甲州","デラウェア","ナイアガラ"],"e":"スキーヴァ・グロッサ（トロリンガー）×リースリングの交配品種。","p":7,"id":"japan-24"},{"r":"品種","q":"デラウェアの分類として正しいものは？","o":["白（グリ系品種ともいう）","黒","野生ブドウ系の黒","ヨーロッパ系交配品種の白"],"e":"アメリカ系品種。明治初期に伝来した。","p":7,"id":"japan-25"},{"r":"品種","q":"マスカット・ベーリーAの交配の組み合わせは？","o":["ベーリー × マスカット・ハンブルグ","ベーリー × マスカット・オブ・アレキサンドリア","ヤマブドウ × カベルネ・ソーヴィニヨン","スキーヴァ・グロッサ × リースリング"],"e":"ヤマブドウ×カベルネ・ソーヴィニヨンはヤマ・ソービニオン。","p":7,"id":"japan-26"},{"r":"北海道","q":"北海道のブドウ品種の特徴は？","o":["ドイツ系品種が多く、白ワイン用品種が圧倒的に多い","フランス系の黒ブドウが中心","甲州が主力","ヤマブドウが中心"],"e":"ケルナー、ミュラー・トゥルガウ、バッカスなど。","p":8,"id":"japan-27"},{"r":"北海道","q":"北海道・空知地方で増加傾向にある品種は？","o":["ピノ・ノワールとソーヴィニヨン・ブラン","ケルナーとミュラー・トゥルガウ","メルロとシャルドネ","ナイアガラとキャンベル・アーリー"],"e":"ケルナーは減少している。","p":8,"id":"japan-28"},{"r":"岩手県","q":"岩手県の説明として正しいものは？","o":["明治以前からヤマブドウを発酵させた酒を飲む習慣があり、リースリング・リオンとヤマブドウが2大品種","甲州とマスカット・ベーリーAが2大品種","デラウェアの生産量が全国1位","「ワインコースト」と呼ばれる産地がある"],"e":"現在もヤマブドウを活かしたワイン造りが行われている。","p":8,"id":"japan-29"},{"r":"山形県","q":"デラウェアの生産量が全国1位の県は？","o":["山形県","山梨県","長野県","新潟県"],"e":"山形の赤用品種ではマスカット・ベーリーAが最も多い。","p":8,"id":"japan-30"},{"r":"新潟県","q":"「日本ワインの父」川上善兵衛が開いたブドウ園は？","o":["岩の原葡萄園","大日本山梨葡萄酒会社","祝村葡萄酒醸造会社","勝沼ワイナリークラブ"],"e":"新潟県が本拠。マスカット・ベーリーAなどの交配育種に力を注いだ。","p":8,"id":"japan-31"},{"r":"新潟県","q":"角田浜と越前浜に設立されたワイナリーが、砂質土壌を活かした産地形成のために名乗っている一帯の名前は？","o":["新潟ワインコースト","信州ワインバレー","桔梗ヶ原ワインバレー","千曲川ワインバレー"],"e":"2006〜2013年に設立された5軒のワイナリー。","p":8,"id":"japan-32"},{"r":"長野県","q":"「全国で最も活気のある県」とされる長野県が、2013年に発表した構想は？","o":["信州ワインバレー構想","ワイン特区構想","新潟ワインコースト構想","Koshu of Japan"],"e":"桔梗ヶ原・千曲川・日本アルプス・天竜川の4つのワインバレー。","p":8,"id":"japan-33"},{"r":"長野県","q":"長野県で生産数量が全国トップとなっているヨーロッパ系品種の組み合わせは？","o":["メルロ、シャルドネ、ソーヴィニヨン・ブラン","カベルネ・ソーヴィニヨン、ピノ・ノワール、リースリング","ケルナー、ツヴァイゲルト、ピノ・ノワール","甲州、マスカット・ベーリーA、デラウェア"],"e":"長野はヨーロッパ系品種の栽培が盛ん。","p":9,"id":"japan-34"},{"r":"山梨県","q":"山梨県にあるワイナリーは全国のおよそどれくらい？","o":["3割弱","1割弱","5割","7割以上"],"e":"日本ワインの生産量も最大。","p":10,"id":"japan-35"},{"r":"山梨県","q":"山梨県の主な品種で、全体の約8割を占める2品種は？","o":["甲州とマスカット・ベーリーA","甲州とデラウェア","メルロとシャルドネ","マスカット・ベーリーAとブラック・クイーン"],"e":"白用品種が6割を占める。","p":10,"id":"japan-36"}]},{"k":"france","n":"フランス","qs":[{"r":"総論","q":"フランスのブドウ畑の栽培面積は世界で何位？","o":["3位（スペイン、中国に次ぐ）","1位","2位（スペインに次ぐ）","4位"],"e":"年間生産量はイタリアに次いで2位、ワイン輸出額は1位。","p":12,"id":"france-1"},{"r":"総論","q":"フランスのワインの年間生産量とワイン輸出額の世界順位の組み合わせは？","o":["生産量2位、輸出額1位","生産量1位、輸出額1位","生産量2位、輸出額2位","生産量3位、輸出額1位"],"e":"生産量はイタリアに次ぐ2位、輸出額はダントツの1位。","p":12,"id":"france-2"},{"r":"総論","q":"A.O.C.（原産地統制呼称）が成立した年は？","o":["1935年","1855年","1789年","2009年"],"e":"今日のEUのワイン法A.O.P.の基礎となっている。","p":12,"id":"france-3"},{"r":"総論","q":"フランスの10の主要産地として教本で挙げられていないものは？","o":["カオール地方","アルザス地方","ジュラ・サヴォワ地方","南西地方"],"e":"10産地：シャンパーニュ、アルザス、ブルゴーニュ＆ボージョレ、ジュラ・サヴォワ、ローヌ、プロヴァンス＆コルシカ、ラングドック・ルーション、南西、ボルドー、ロワール。カオールは南西地方のA.O.C.。","p":12,"id":"france-4"},{"r":"ワイン法","q":"A.O.C.（＝A.O.P.）の説明として正しいものは？","o":["最上位のカテゴリーで、原産地・品種・栽培・醸造・熟成・ラベル表記などの規定が細かく厳しい","地理的表示のないワイン","2009年にヴァン・ド・ペイから移行した","品種と収穫年の表示ができない"],"e":"2008年のEUの新しいワイン法でA.O.P.として登録された。","p":13,"id":"france-5"},{"r":"ワイン法","q":"I.G.P.の日本語名は？","o":["地理的表示保護","原産地呼称保護","原産地統制呼称","地理的表示のないワイン"],"e":"A.O.C.より規定がゆるやか。2009年よりヴァン・ド・ペイがI.G.P.になった。","p":13,"id":"france-6"},{"r":"シャンパーニュ","q":"「シャンパーニュ」という言葉が指すものとして正しいものは？","o":["産地の名前であり、そこで造られる発泡性ワインの名前でもある","発泡性ワインの製法の名前だけを指す","ブドウ品種の名前","フランスの発泡性ワインすべての総称"],"e":"パリから約140km東に位置する、フランスで最も重要な発泡性ワインの産地。","p":13,"id":"france-7"},{"r":"シャンパーニュ","q":"2015年にユネスコ世界遺産に登録されたものは？","o":["シャンパーニュの丘陵、メゾンとカーヴ","ランスの大聖堂","サン・テミリオン地域","ブルゴーニュのクリマ"],"e":"ランスの大聖堂は1991年に世界文化遺産に登録。","p":14,"id":"france-8"},{"r":"シャンパーニュ","q":"シャンパーニュの主要3品種の組み合わせは？","o":["シャルドネ、ピノ・ノワール、ムニエ","シャルドネ、ピノ・ブラン、ピノ・ノワール","ソーヴィニヨン・ブラン、ピノ・ノワール、ガメイ","シャルドネ、ムニエ、カベルネ・フラン"],"e":"白はシャルドネ、黒はピノ・ノワールとムニエ。","p":14,"id":"france-9"},{"r":"シャンパーニュ","q":"ボトルに収穫年を表示するシャンパーニュ（ミレジメ）の別名は？","o":["ヴィンテージ・シャンパーニュ","ノン・ミレジメ","ブラン・ド・ブラン","キュヴェ"],"e":"表示した収穫年のブドウを100%使い、瓶詰め後最低36カ月熟成。","p":14,"id":"france-10"},{"r":"シャンパーニュ","q":"ノン・ミレジメのシャンパーニュに義務付けられている瓶詰め後の熟成期間は？","o":["15カ月","9カ月","24カ月","36カ月"],"e":"ミレジメは36カ月以上。","p":14,"id":"france-11"},{"r":"シャンパーニュ","q":"「ブラン・ド・ノワール」とはどんなシャンパーニュ？","o":["黒ブドウだけで造ったもの","白ブドウだけで造ったもの","ロゼのシャンパーニュ","収穫年を表示したもの"],"e":"白ブドウだけで造ったものはブラン・ド・ブラン。","p":14,"id":"france-12"},{"r":"シャンパーニュ","q":"ラベルの「N.M.（ネゴシアン・マニピュラン）」が示す生産者は？","o":["ブドウを一部または全部、外部から購入して醸造する生産者","自家ブドウ栽培中心の製造者","協同組合","ブドウを販売するだけの栽培農家"],"e":"生産のほとんどがN.M.。R.M.（レコルタン・マニピュラン）は自家ブドウ栽培中心で小規模な会社が多い。","p":14,"id":"france-13"},{"r":"シャンパーニュ","q":"A.O.C.シャンパーニュで認められているタイプは？","o":["発泡白、発泡ロゼ","発泡白のみ","発泡白、発泡ロゼ、発泡赤","発泡白、スティルの白"],"e":"スティル・ワインはコトー・シャンプノワなど別のA.O.C.。","p":14,"id":"france-14"},{"r":"シャンパーニュ","q":"シャンパーニュの醸造工程で、「調合」の次に行う工程は？","o":["瓶詰め（ティラージュ）","動瓶","澱抜き","マロラクティック発酵"],"e":"収穫→圧搾→果汁清澄→アルコール発酵→マロラクティック発酵→調合→瓶詰め→瓶内二次発酵→瓶内熟成→動瓶→澱抜き→糖分調整→打栓。","p":15,"id":"france-15"},{"r":"シャンパーニュ","q":"シャンパーニュの醸造工程の最後の4つを正しい順に並べたものは？","o":["動瓶 → 澱抜き → 糖分調整 → 打栓","澱抜き → 動瓶 → 糖分調整 → 打栓","動瓶 → 糖分調整 → 澱抜き → 打栓","糖分調整 → 動瓶 → 澱抜き → 打栓"],"e":"動瓶（ルミュアージュ）で澱を瓶口に集め、澱抜き（デゴルジュマン）で取り除き、ドサージュで甘さを調整して打栓する。","p":15,"id":"france-16"},{"r":"シャンパーニュ","q":"瓶内の澱を瓶口に集めるため、ボトルを少しずつ回転させ傾けていく工程は？","o":["動瓶（ルミュアージュ）","澱抜き（デゴルジュマン）","瓶詰め（ティラージュ）","調合（アッサンブラージュ）"],"e":"現在はジャイロパレットという機械が担うことが多い。","p":15,"id":"france-17"},{"r":"シャンパーニュ","q":"澱抜き後に、甘さを調整するための液体を加える工程は？","o":["糖分調整（ドサージュ）","調合（アッサンブラージュ）","瓶詰め（ティラージュ）","果汁清澄（デブルバージュ）"],"e":"加える液体はリキュール・デクスペディシオン（リキュール・ド・ドサージュ）。","p":15,"id":"france-18"},{"r":"アルザス","q":"アルザスのブドウ畑が広がる場所として正しいものは？","o":["ヴォージュ山脈の東側丘陵の、南北に長い帯状の斜面","ヴォージュ山脈の西側の平野","ライン川東岸のドイツ側の斜面","ジュラ山脈の南側の盆地"],"e":"ストラスブールからミュルーズまで南北に長い帯状に広がる。","p":16,"id":"france-19"},{"r":"アルザス","q":"アルザスワインの特徴として正しいものは？","o":["主に単一品種から造られ、品種名をラベルに表記し、フルート型のボトルに入れる","主に複数品種をブレンドし、ボルドー型のボトルに入れる","赤ワインが大半を占める","品種名の表示は禁止されている"],"e":"フランスの中でもアルザス独自のスタイルを貫いている。","p":16,"id":"france-20"},{"r":"アルザス","q":"アルザス・グラン・クリュで認められている4品種に含まれないものは？","o":["ピノ・ノワール","リースリング","ゲヴュルツトラミネール","ミュスカ"],"e":"4品種はリースリング、ゲヴュルツトラミネール、ピノ・グリ、ミュスカ（一部例外あり）。","p":16,"id":"france-21"},{"r":"アルザス","q":"アルザス・グラン・クリュで認められているワインのタイプは？","o":["白のみ","赤と白","白とロゼ","赤・白・ロゼ"],"e":"1975年制定、51の区画（リュー・ディ）が認められている。","p":16,"id":"france-22"},{"r":"アルザス","q":"フランスの家庭で消費されるA.O.C.のスパークリング・ワインで第1位のものは？","o":["クレマン・ダルザス","クレマン・ド・ブルゴーニュ","クレマン・ド・ロワール","シャンパーニュ"],"e":"シャンパーニュ方式のスパークリングは19世紀末からアルザスで広がった。","p":16,"id":"france-23"},{"r":"アルザス","q":"アルザスのA.O.C.「アルザス」の別名は？","o":["ヴァン・ダルザス","エデルツヴィッケール","ジャンティ","クレマン・ダルザス"],"e":"エデルツヴィッケールやジャンティは複数品種をブレンドした場合の表示。","p":16,"id":"france-24"},{"r":"ブルゴーニュ","q":"ブルゴーニュのワイン造りが大きく発展したきっかけは？","o":["ベネディクト派のクリュニィ会とシトー会の修道院","古代ギリシャのフォカイア人","19世紀のフランス大革命","オランダ商人の干拓"],"e":"修道院が良いクリマを識別し、クロ・ド・ヴージョやクロ・ド・タールなどのクロを築いた。","p":17,"id":"france-25"},{"r":"ブルゴーニュ","q":"コート・ド・ニュイ地区とコート・ド・ボーヌ地区を合わせた呼び名と、その意味の組み合わせは？","o":["コート・ドール（黄金の丘）","コート・ドール（石灰の丘）","オート・コート（高い丘）","コート・シャロネーズ（黄金の丘）"],"e":"ディジョンから南へ約50kmにわたる丘陵の斜面。","p":18,"id":"france-26"},{"r":"ブルゴーニュ","q":"ブルゴーニュで栽培される白ブドウで、ブーズロンやクレマン・ド・ブルゴーニュにも使われる品種は？","o":["アリゴテ","ソーヴィニヨン・ブラン","ピノ・ブラン","ミュスカデ"],"e":"主な白ブドウはシャルドネとアリゴテ、黒ブドウはピノ・ノワールとガメイ。","p":18,"id":"france-27"},{"r":"ブルゴーニュ","q":"シャブリ地区で生まれるワインの特徴は？","o":["爽やかでミネラル豊かなシャルドネの白","長期熟成型のピノ・ノワールの赤","ガメイから造るフルーティな赤","ソーヴィニヨン・ブランの辛口白"],"e":"冷涼な気候と小さな牡蠣の化石を含む土壌から生まれる。A.O.C.シャブリは白のみ。","p":18,"id":"france-28"},{"r":"ブルゴーニュ","q":"コート・ド・ニュイ地区の説明として正しいものは？","o":["赤ワインが約90%を占め、ピノ・ノワールから長期熟成に耐える赤が生まれる","白ワインの生産量が約40%で、白のグラン・クリュが集中する","ガメイから造る赤が中心","ブルゴーニュ地方で最も北に位置する"],"e":"ブルゴーニュの赤のグラン・クリュはこの地区に集中している。","p":19,"id":"france-29"},{"r":"ブルゴーニュ","q":"グラン・クリュ「シャンベルタン」がある村は？","o":["ジュヴレ・シャンベルタン村","モレ・サン・ドニ村","シャンボール・ミュジニィ村","ヴォーヌ・ロマネ村"],"e":"","p":19,"id":"france-30"},{"r":"ブルゴーニュ","q":"グラン・クリュ「クロ・ド・タール」がある村は？","o":["モレ・サン・ドニ村","ジュヴレ・シャンベルタン村","ヴージョ村","ヴォーヌ・ロマネ村"],"e":"","p":19,"id":"france-31"},{"r":"ブルゴーニュ","q":"グラン・クリュ「ミュジニィ」がある村と、認められている色の組み合わせは？","o":["シャンボール・ミュジニィ村／赤・白","シャンボール・ミュジニィ村／赤のみ","ヴォーヌ・ロマネ村／赤のみ","モレ・サン・ドニ村／赤・白"],"e":"","p":19,"id":"france-32"},{"r":"ブルゴーニュ","q":"グラン・クリュ「クロ・ド・ヴージョ」がある村は？","o":["ヴージョ村","ヴォーヌ・ロマネ村","ニュイ・サン・ジョルジュ村","シャンボール・ミュジニィ村"],"e":"","p":19,"id":"france-33"},{"r":"ブルゴーニュ","q":"グラン・クリュ「ロマネ・コンティ」がある村は？","o":["ヴォーヌ・ロマネ村","ジュヴレ・シャンベルタン村","ヴージョ村","フラジェ・エシェゾー村"],"e":"","p":19,"id":"france-34"},{"r":"ブルゴーニュ","q":"コート・ド・ボーヌ地区の特徴として正しいものは？","o":["世界に知られた白ワインのグラン・クリュが集中している","赤ワインが約90%を占める","ガメイが主体","ブルゴーニュで最も北に位置する"],"e":"白ワインの生産量は約40%で、コート・ド・ニュイより多い。","p":19,"id":"france-35"},{"r":"ブルゴーニュ","q":"コート・ド・ボーヌ地区の村名A.O.C.として、教本でマーカーが引かれているものの組み合わせは？","o":["ムルソー、ピュリニィ・モンラッシェ、シャサーニュ・モンラッシェ","ポマール、ヴォルネイ、ボーヌ","ジュヴレ・シャンベルタン、モレ・サン・ドニ、ヴォーヌ・ロマネ","リュリー、メルキュレ、ジヴリ"],"e":"3村とも赤・白が認められている。","p":20,"id":"france-36"},{"r":"ブルゴーニュ","q":"白のグラン・クリュ「コルトン・シャルルマーニュ」について正しいものは？","o":["アロース・コルトン村など3カ村にまたがる","ピュリニィ・モンラッシェ村にある","赤と白が認められている","コート・ド・ニュイ地区にある"],"e":"アロース・コルトン、ラドワ・セリニィ、ペルナン・ヴェルジュレスの3カ村。","p":20,"id":"france-37"},{"r":"ブルゴーニュ","q":"グラン・クリュ「モンラッシェ」がまたがる2つの村は？","o":["ピュリニィ・モンラッシェ村とシャサーニュ・モンラッシェ村","ムルソー村とピュリニィ・モンラッシェ村","シャサーニュ・モンラッシェ村とサントネイ村","アロース・コルトン村とラドワ村"],"e":"白のみのグラン・クリュ。","p":20,"id":"france-38"},{"r":"ボージョレ","q":"ボージョレ地区北部の花崗岩を基盤とした丘陵地帯に特に適している品種は？","o":["ガメイ","ピノ・ノワール","シャルドネ","シラー"],"e":"長期熟成の可能な赤ワインが生まれる。","p":21,"id":"france-39"},{"r":"ボージョレ","q":"ボージョレ・ヌーヴォーの解禁日は？","o":["11月の第3木曜日","10月の第3木曜日","11月の第1木曜日","12月の第1木曜日"],"e":"A.O.C.ボージョレ・ヴィラージュとA.O.C.ボージョレで造られる。","p":21,"id":"france-40"},{"r":"ボージョレ","q":"ボージョレ・ヌーヴォーの最大の輸出先は？","o":["日本","アメリカ","イギリス","ドイツ"],"e":"","p":21,"id":"france-41"},{"r":"ボージョレ","q":"ボージョレ北部で村名を名乗る10のA.O.C.の総称は？","o":["クリュ・ボージョレ（クリュ・デュ・ボージョレ）","ボージョレ・ヴィラージュ","ボージョレ・シュペリュール","グラン・クリュ・ボージョレ"],"e":"赤のみ。ムーラン・ア・ヴァン、モルゴンなどが含まれる。","p":21,"id":"france-42"},{"r":"ボージョレ","q":"クリュ・ボージョレに含まれるA.O.C.は？","o":["ムーラン・ア・ヴァン","ブーズロン","ヴィレ・クレッセ","サン・ヴェラン"],"e":"モルゴンもクリュ・ボージョレ。ほかの3つはマコネやコート・シャロネーズのA.O.C.。","p":21,"id":"france-43"},{"r":"ジュラ","q":"ジュラ地方の独特なワインの組み合わせとして正しいものは？","o":["ヴァン・ジョーヌ（黄ワイン）とヴァン・ド・パイユ（藁ワイン）","ヴァン・ジョーヌ（黄ワイン）とヴァン・グリ","クレマンとヴァン・ドゥー・ナチュレル","ヴァンダンジュ・タルディーヴとセレクシオン・ド・グラン・ノーブル"],"e":"ジュラのブドウ品種と隣のブルゴーニュの品種を用いる。","p":21,"id":"france-44"},{"r":"ジュラ","q":"ヴァン・ジョーヌの説明として正しいものは？","o":["サヴァニャンから造り、酵母の膜の下で60カ月以上熟成させた辛口","シャルドネから造り、樽で24カ月熟成させた甘口","ブドウを藁の上で乾燥させて造る甘口","プールサールから造るロゼ"],"e":"黄色を帯びた色で、くるみやヘーゼルナッツの風味をもつ。","p":22,"id":"france-45"},{"r":"ジュラ","q":"「フランス5大白ワイン」と称される、ヴァン・ジョーヌのみのA.O.C.は？","o":["シャトー・シャロン","アルボワ","コート・デュ・ジュラ","マクヴァン・デュ・ジュラ"],"e":"","p":22,"id":"france-46"},{"r":"ジュラ","q":"ヴァン・ド・パイユの味わいのタイプは？","o":["甘口","辛口","極辛口","発泡性"],"e":"収穫したブドウを藁の上で乾燥させ、糖分を凝縮させる。","p":22,"id":"france-47"},{"r":" 、フランスのA.O.C.ロゼワインの割合は？","o":["42%","12%","22%","62%"],"e":"世界のロゼワインの約6%も生産する（2017年）。","p":25,"id":"france-61"},{"r":"コルシカ","q":"コルシカ島の説明として正しいものは？","o":["皇帝ナポレオンの生誕地で、文化的にもワインにおいてもイタリアの影響が色濃い","スペインの影響が強く、カタルーニャ語が話される","ドイツの影響が強く、フルート型ボトルを使う","地中海で最も大きな島"],"e":"歴史的にピサやジェノヴァの領土であった時期が長い。","p":26,"id":"france-62"},{"r":"ラングドック・ルーション","q":"ラングドック・ルーション地方のI.G.P.ワインは、フランスの全I.G.P.ワインの何%にあたる？","o":["80%","30%","50%","95%"],"e":"I.G.P.ワインの生産量はこの地方全体の70%以上を占める。地中海沿岸の産地。","p":27,"id":"france-63"},{"r":"ラングドック・ルーション","q":"ルーション地方のV.D.N.（天然甘口ワイン）として教本でマーカーが引かれているA.O.C.は？","o":["バニュルス","フィトゥー","ピック・サン・ルー","コルビエール"],"e":"赤・白・ロゼ。ラングドック全域のA.O.C.は「ラングドック」。","p":28,"id":"france-64"},{"r":"南西地方","q":"南西地方のワインの特徴として正しいものは？","o":["ボルドーに近い産地はボルドーと同じ品種・スタイル、離れるにつれ土着品種を使った個性あるワインになる","全域でボルドーと同じ品種だけが使われる","全域でシラーとグルナッシュが主体","発泡性ワインの専門産地"],"e":"ボルドーの東から中央山塊、南はピレネー山脈まで。フォワグラやトリュフの産地としても知られる。","p":29,"id":"france-65"},{"r":"南西地方","q":"ドルドーニュ川右岸を上った、ボルドーとほぼ同じ品種が栽培される地区の主なA.O.C.は？","o":["ベルジュラック","カオール","マディラン","ジュランソン"],"e":"ベルジュラック地区。甘口白のモンバジャックもある。","p":29,"id":"france-66"},{"r":"南西地方","q":"南西地方のA.O.C.と主体となる品種の組み合わせで正しいものは？","o":["カオール ― マルベック","マディラン ― マルベック","カオール ― タナ","フロントン ― タナ"],"e":"マディランはタナ、フロントンはネグレット。","p":30,"id":"france-67"},{"r":"南西地方","q":"マディランの主体となる黒ブドウは？","o":["タナ","ネグレット","プティ・マンサン","モーザック"],"e":"ピレネー地区。ジュランソンはプティ・マンサン、グロ・マンサンが主体。","p":30,"id":"france-68"},{"r":"南西地方","q":"アルビの町がゆかりの地として知られる人物と、その地区のA.O.C.の組み合わせは？","o":["ロートレック ― ガイヤック","セザンヌ ― ガイヤック","ロートレック ― ジュランソン","ナポレオン ― カオール"],"e":"トゥールーズ・アヴェイロネ・中央山塊地区。","p":30,"id":"france-69"},{"r":"ボルドー","q":"「ボルドー」という名前の由来は？","o":["水のほとり","月の港","黄金の丘","美の島"],"e":"港はガロンヌ川からジロンド川を通じて世界につながる。","p":30,"id":"france-70"},{"r":"ボルドー","q":"大きく蛇行した形から「月の港」と呼ばれる港があるのは？","o":["ボルドー","マルセイユ","ナント","リヨン"],"e":"","p":30,"id":"france-71"},{"r":"ボルドー","q":"ボルドーワインが英国との交易で栄えるきっかけとなった1152年の出来事は？","o":["アキテーヌ公国のアリエノールが後の英国王アンリと結婚し、アキテーヌ地方が英国領となった","ナポレオン3世がパリ万博で格付けを指示した","法皇がアヴィニョンに座所を移した","フィロキセラが発生した"],"e":"当時のワインは色が淡く、クラレットと呼ばれた。","p":30,"id": const KEY = 'wineSilverQuiz.v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { store = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const byId = {}; DATA.forEach(c=>c.qs.forEach(q=>{ q.c=c.n; byId[q.id]=q; }));
const $ = id => document.getElementById(id);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
$('total').textContent = Object.keys(byId).length;

function isWrong(id){ const s=store[id]; return s && s.last===false; }
function renderHome(){
  const box=$('countries'); const sel = new Set([...box.querySelectorAll('input:checked')].map(i=>i.value));
  const first = box.children.length===0;
  box.innerHTML='';
  DATA.forEach(c=>{
    const w=c.qs.filter(q=>isWrong(q.id)).length;
    const l=document.createElement('label'); l.className='chk';
    l.innerHTML=`<input type="checkbox" value="${c.k}" ${first||sel.has(c.k)?'checked':''}> ${c.n}${w?`<span class="bad">×${w}</span>`:''}<small>${c.qs.length}問</small>`;
    box.appendChild(l);
  });
  let rows='<tr><th>国</th><th>解いた問題</th><th>正答率</th><th>要復習</th></tr>';
  DATA.forEach(c=>{
    let done=0,ok=0,tries=0,w=0;
    c.qs.forEach(q=>{const s=store[q.id]; if(s){done++; ok+=s.ok; tries+=s.n; if(s.last===false)w++;}});
    rows+=`<tr><td>${c.n}</td><td>${done} / ${c.qs.length}</td><td>${tries?Math.round(ok/tries*100)+'%':'—'}</td><td>${w||'—'}</td></tr>`;
  });
  $('stats').innerHTML=rows;
  updateCount();
}
function selected(){ return [...document.querySelectorAll('#countries input:checked')].map(i=>i.value); }
function mode(){ return document.querySelector('input[name=mode]:checked').value; }
function pool(){
  const ks=new Set(selected()); let p=[];
  DATA.forEach(c=>{ if(ks.has(c.k)) p=p.concat(c.qs); });
  if(mode()==='wrong') p=p.filter(q=>isWrong(q.id));
  return p;
}
function updateCount(){
  const p=pool(); const m=mode();
  const n = (m==='10'||m==='20') ? Math.min(+m,p.length) : p.length;
  $('count').textContent = n ? `${n}問を出題します` : (m==='wrong' ? '選んだ国に、間違えた問題はありません' : '国を選んでください');
  $('start').disabled = !n;
}
document.addEventListener('change', e=>{ if(e.target.closest('#home')) updateCount(); });
$('all').onclick=()=>{document.querySelectorAll('#countries input').forEach(i=>i.checked=true);updateCount();};
$('none').onclick=()=>{document.querySelectorAll('#countries input').forEach(i=>i.checked=false);updateCount();};

let Q=[], idx=0, score=0, wrongNow=[];
function startWith(list){
  Q=list.map(q=>({q, order:shuffle([0,1,2,3])})); idx=0; score=0; wrongNow=[];
  show('quiz'); renderQ();
}
$('start').onclick=()=>{
  let p=pool(); const m=mode();
  if($('shuffleQ').checked || m==='10' || m==='20') p=shuffle(p);
  if(m==='10'||m==='20') p=p.slice(0,+m);
  startWith(p);
};
function show(id){ ['home','quiz','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id)); window.scrollTo(0,0); }
function renderQ(){
  const {q,order}=Q[idx];
  $('qinfo').textContent=`${q.c}・${q.r}　${idx+1} / ${Q.length}`;
  $('qscore').textContent=`正解 ${score}`;
  $('prog').style.width=(idx/Q.length*100)+'%';
  $('qtext').textContent=q.q;
  $('fb').innerHTML=''; $('next').classList.add('hidden');
  const box=$('opts'); box.innerHTML='';
  order.forEach((oi,k)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<b>${'ABCD'[k]}</b>`; b.appendChild(document.createTextNode(q.o[oi]));
    b.onclick=()=>answer(oi,b); box.appendChild(b);
  });
}
function answer(oi,btn){
  const {q,order}=Q[idx]; const ok = oi===0;
  const btns=[...$('opts').children];
  btns.forEach((b,k)=>{ b.disabled=true; if(order[k]===0) b.classList.add('ok'); });
  if(!ok) btn.classList.add('ng');
  const s=store[q.id]||{n:0,ok:0}; s.n++; if(ok)s.ok++; s.last=ok; store[q.id]=s; save();
  if(ok) score++; else wrongNow.push(q);
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解':'不正解'}　答え：${esc(q.o[0])}</strong>${q.e?esc(q.e):''}<div class="src">教本 p.${q.p}</div></div>`;
  $('qscore').textContent=`正解 ${score}`;
  const nx=$('next'); nx.textContent = idx===Q.length-1 ? '結果を見る' : '次へ'; nx.classList.remove('hidden'); nx.focus();
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
$('next').onclick=()=>{ if(idx<Q.length-1){idx++;renderQ();} else finish(); };
$('quit').onclick=()=>{ if(idx>0||$('next').offsetParent) finish(); else { show('home'); renderHome(); } };
function finish(){
  const answered = wrongNow.length + score;
  $('rscore').textContent = `${score} / ${answered}`;
  const pct = answered ? Math.round(score/answered*100) : 0;
  $('rmsg').textContent = answered ? `正答率 ${pct}%` : '';
  $('rwrong').innerHTML = wrongNow.map(item).join('');
  $('rwrongCard').classList.toggle('hidden', !wrongNow.length);
  $('retryWrong').classList.toggle('hidden', !wrongNow.length);
  show('result');
}
function item(q){ return `<li>${esc(q.q)}<br><span class="a">答え：${esc(q.o[0])}</span>${q.e?'<br>'+esc(q.e):''} <span class="note">（${q.c}・p.${q.p}）</span></li>`; }
$('retryWrong').onclick=()=>startWith(shuffle(wrongNow));
$('home2').onclick=()=>{ show('home'); renderHome(); };
$('showWrong').onclick=()=>{
  const ws=Object.keys(store).filter(isWrong).map(id=>byId[id]).filter(Boolean);
  $('wrongItems').innerHTML = ws.length ? ws.map(item).join('') : '<li>間違えた問題はありません</li>';
  $('wrongList').classList.toggle('hidden');
};
$('reset').onclick=()=>$('confirmReset').classList.remove('hidden');
$('cancelReset').onclick=()=>$('confirmReset').classList.add('hidden');
$('doReset').onclick=()=>{ store={}; save(); $('confirmReset').classList.add('hidden'); $('wrongList').classList.add('hidden'); renderHome(); };
renderHome();
</script>
</body>
